services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: vilt_pos_app
    restart: unless-stopped
    working_dir: /var/www/html
    env_file:
      - .env
    environment:
      - REVERB_INTERNAL_HOST=reverb
    volumes:
      - .:/var/www/html
    networks:
      - vilt_pos_network

  nginx:
    image: nginx:1.27-alpine
    container_name: vilt_pos_nginx
    restart: unless-stopped
    ports:
      - "${APP_PORT:-8000}:80"
    volumes:
      - .:/var/www/html:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app
      - reverb

    networks:
      - vilt_pos_network

  node:
    image: node:22-bookworm-slim
    container_name: vilt_pos_node
    restart: "no"
    working_dir: /var/www/html
    ports:
      - "${VITE_PORT:-5173}:5173"
    environment:
      - VITE_USE_POLLING=true
    volumes:
      - .:/var/www/html
    command: sh -c "if [ ! -d 'node_modules' ] || [ ! -d 'public/build' ]; then npm install && npm run build; fi"
    networks:
      - vilt_pos_network

  queue:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: vilt_pos_queue
    restart: unless-stopped
    working_dir: /var/www/html
    env_file:
      - .env
    environment:
      - REVERB_INTERNAL_HOST=reverb
    volumes:
      - .:/var/www/html
    depends_on:
      - app
    command: php artisan queue:work --verbose --tries=3 --timeout=90
    networks:
      - vilt_pos_network

  reverb:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: vilt_pos_reverb
    restart: unless-stopped
    working_dir: /var/www/html
    env_file:
      - .env
    volumes:
      - .:/var/www/html
    ports:
      - "8080:8080"
    depends_on:
      - app
    command: php artisan reverb:start --host=0.0.0.0 --port=8080
    networks:
      - vilt_pos_network


  tunnel:
    image: cloudflare/cloudflared:latest
    container_name: vilt_pos_tunnel
    restart: unless-stopped
    command: ${CLOUDFLARE_TUNNEL_COMMAND:-tunnel --no-autoupdate --url http://nginx:80}
    depends_on:
      - nginx
    networks:
      - vilt_pos_network

networks:
  vilt_pos_network:
    driver: bridge

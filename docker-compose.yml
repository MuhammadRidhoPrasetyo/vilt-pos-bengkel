services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: vilt_pos_app
    restart: unless-stopped
    working_dir: /var/www/html
    env_file:
      - .env
    volumes:
      - .:/var/www/html
    networks:
      - vilt_pos_network

  nginx:
    image: nginx:1.27-alpine
    container_name: vilt_pos_nginx
    restart: unless-stopped
    ports:
      - "${APP_PORT:-8000}:80"
    volumes:
      - .:/var/www/html:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app
    networks:
      - vilt_pos_network

  node:
    image: node:22-bookworm-slim
    container_name: vilt_pos_node
    restart: unless-stopped
    working_dir: /var/www/html
    ports:
      - "${VITE_PORT:-5173}:5173"
    environment:
      - VITE_USE_POLLING=true
    volumes:
      - .:/var/www/html
    command: sh -c "npm install && npm run dev"
    networks:
      - vilt_pos_network

  queue:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: vilt_pos_queue
    restart: unless-stopped
    working_dir: /var/www/html
    env_file:
      - .env
    volumes:
      - .:/var/www/html
    depends_on:
      - app
    command: php artisan queue:work --verbose --tries=3 --timeout=90
    networks:
      - vilt_pos_network

networks:
  vilt_pos_network:
    driver: bridge
